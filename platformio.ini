; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; 正常整车固件不要编译独立 IMU 可视化测试入口。
build_src_filter =
    +<*>
    -<imu_visualizer_main.cpp>

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    madhephaestus/ESP32Servo@^3.0.9
    askuric/Simple FOC@2.2.3
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

upload_protocol = esptool
upload_speed = 115200
monitor_speed = 921600 ; 运行后查看串口用代码里的 921600

[env:imu_visualizer]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; 独立 IMU 可视化验证固件：源码集中放在 tools/imu_debug_tool/firmware，
; src/imu_visualizer_main.cpp 只是一个很薄的入口壳，不编译整车 main.cpp、蓝牙、底盘、炮塔 FOC 等逻辑。
build_src_filter =
    +<imu_visualizer_main.cpp>

build_flags =
    -Isrc

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
